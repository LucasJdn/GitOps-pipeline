name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DESTROY-PRODUCTION" to confirm destruction of all cloud infrastructure'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: project05
  ENVIRONMENT: production

jobs:
  destroy:
    name: Teardown Cloud Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      # The input is untrusted text: it is passed through env and only ever
      # expanded by the shell as a quoted variable, never interpolated into the
      # script body (that would allow shell injection via the workflow input).
      - name: Validate Confirmation Input
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DESTROY-PRODUCTION" ]; then
            echo "❌ Confirmation failed. Expected 'DESTROY-PRODUCTION' but received: ${CONFIRMATION}"
            exit 1
          fi
          echo "⚠️ Confirmation verified. Proceeding with teardown..."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same derivation as deploy.yml: the backend names come from the account
      # the role lives in, so a recreated bootstrap stack cannot break init.
      - name: Resolve Terraform Backend
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=${PROJECT_NAME}-terraform-state-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "lock_table=${PROJECT_NAME}-terraform-lock" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ steps.backend.outputs.lock_table }}"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
