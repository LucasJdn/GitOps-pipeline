name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for requesting the JWT OIDC token
  contents: read    # Required for actions/checkout

# Never run two pipelines against the same infrastructure at once
concurrency:
  group: gitops-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: project05
  ENVIRONMENT: production

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test Microservice Application
  # ----------------------------------------------------------------------------
  test:
    name: Test Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: node --check server.js

      - name: Run Tests
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Terraform + Container Image
  #
  # Order on main matters to avoid the "empty ECR" chicken-and-egg problem:
  #   1. create the ECR repository (targeted apply)
  #   2. build & push the image to it
  #   3. apply the rest of the infrastructure (ECS service can now pull the image)
  # Pull requests only run fmt / validate / plan.
  # ----------------------------------------------------------------------------
  terraform:
    name: Terraform & Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    env:
      # Fork pull requests must never receive AWS credentials: the plan phase
      # executes Terraform configuration coming from the PR, which would then
      # run with this role's permissions.
      CAN_ASSUME_ROLE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Keyless)
        if: env.CAN_ASSUME_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend names are derived from the account the role lives in, exactly
      # like terraform/bootstrap names them. Keeping them out of the secrets
      # removes a class of drift ("NoSuchBucket" after the bootstrap stack is
      # recreated or renamed).
      - name: Resolve Terraform Backend
        if: env.CAN_ASSUME_ROLE == 'true'
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=${PROJECT_NAME}-terraform-state-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "lock_table=${PROJECT_NAME}-terraform-lock" >> "$GITHUB_OUTPUT"
          echo "Backend: s3://${PROJECT_NAME}-terraform-state-${ACCOUNT_ID} + ${PROJECT_NAME}-terraform-lock"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # Fork PRs still get fmt/validate, just without touching the remote state.
      - name: Terraform Init (local backend - fork PR)
        if: env.CAN_ASSUME_ROLE != 'true'
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform Init
        if: env.CAN_ASSUME_ROLE == 'true'
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ steps.backend.outputs.lock_table }}"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: env.CAN_ASSUME_ROLE == 'true'
        working-directory: terraform
        run: terraform plan -no-color

      - name: Terraform Apply - ECR repository only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve -target=module.ecr

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            --file app/Dockerfile \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            app/

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply - Full infrastructure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -auto-approve

  # ----------------------------------------------------------------------------
  # Job 3: Blue/Green Deployment with AWS CodeDeploy
  # ----------------------------------------------------------------------------
  deploy:
    name: Blue/Green Deploy (CodeDeploy)
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Keyless, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Narrow role: can register a task definition revision and start a
          # CodeDeploy deployment, nothing else (no infra, no IAM, no S3).
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # describe-task-definition returns read-only fields that register-task-definition
      # rejects, so they are stripped before rendering the new revision.
      # `set -o pipefail` is required: without it a failing `aws` call is masked by
      # jq's exit status and the step "succeeds" with an empty file.
      - name: Download Active Task Definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${PROJECT_NAME}-${ENVIRONMENT}-task" \
            --query "taskDefinition" \
          | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )' > task-def.json
          test -s task-def.json || { echo "::error::task-def.json is empty"; exit 1; }

      - name: Render New Task Definition with Updated Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ needs.terraform.outputs.image_uri }}

      - name: Register New Task Definition Revision
        id: register-task-def
        run: |
          REGISTERED_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render-task-def.outputs.task-definition }}" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "task_definition_arn=$REGISTERED_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS Fargate via CodeDeploy Blue/Green
        run: |
          chmod +x scripts/create_deployment.sh
          ./scripts/create_deployment.sh \
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-codedeploy-app" \
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-deployment-group" \
            "${{ steps.register-task-def.outputs.task_definition_arn }}" \
            "app" \
            3000
